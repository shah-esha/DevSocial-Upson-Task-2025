name: Coverage Challenge

on:
  push:
    branches:
      - main

jobs:
  test-and-check-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests with coverage (ESM)
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Check coverage
        run: node .github/scripts/check-coverage.cjs

      - name: Reveal secret location
        if: success()
        env:
          SCAVENGER_LOCATION: ${{ vars.SCAVENGER_LOCATION }}
        run: |
          echo "COVERAGE GOAL REACHED!"
          echo "------------------------------"
          echo "NEXT LOCATION: $SCAVENGER_LOCATION"
